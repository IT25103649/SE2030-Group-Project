<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Management</title>
</head>
<body>

<h1>Inventory & Warehouse Management</h1>

<h2>Material Management</h2>

<form id="materialForm">

    <label>Material Name:</label>
    <input type="text" id="materialName" required>
    <br><br>

    <label>Material Type:</label>
    <select id="materialType" required>
        <option value="">Select Type</option>
        <option value="Fabric">Fabric</option>
        <option value="Accessory">Accessory</option>
    </select>
    <br><br>

    <label>Batch Number:</label>
    <input type="text" id="batchNumber" required>
    <br><br>

    <label>Storage Location:</label>
    <input type="text" id="storageLocation" required>
    <br><br>

    <label>Quantity:</label>
    <input type="number" id="quantity" min="1" required>
    <br><br>

    <button type="submit">Add Material</button>

</form>

<hr>

<h2>Available Materials</h2>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Batch</th>
        <th>Location</th>
        <th>Quantity</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody id="materialTableBody">
    </tbody>
</table>
<hr>

<h2>Stock In / Stock Out</h2>

<form id="stockTransactionForm">

    <label>Material ID:</label>
    <input type="number" id="transactionMaterialId" required>
    <br><br>

    <label>Transaction Type:</label>
    <select id="transactionType" required>
        <option value="STOCK_IN">Stock In</option>
        <option value="STOCK_OUT">Stock Out</option>
    </select>
    <br><br>

    <label>Quantity:</label>
    <input type="number" id="transactionQuantity" min="1" required>
    <br><br>

    <label>Batch Number:</label>
    <input type="text" id="transactionBatchNumber" required>
    <br><br>

    <label>Storage Location:</label>
    <input type="text" id="transactionStorageLocation" required>
    <br><br>

    <button type="submit">Record Transaction</button>

</form>
<hr>

<h2>Minimum Stock Level</h2>

<form id="minimumStockForm">

    <label>Material ID:</label>
    <input type="number" id="minimumMaterialId" min="1" required>
    <br><br>

    <label>Minimum Quantity:</label>
    <input type="number" id="minimumQuantity" min="0" required>
    <br><br>

    <button type="submit">Set Minimum Stock Level</button>

</form>

<div id="stockAlert"></div>

<hr>

<h2>Stock Transaction History</h2>

<table border="1">
    <thead>
    <tr>
        <th>Transaction ID</th>
        <th>Material ID</th>
        <th>Transaction Type</th>
        <th>Quantity</th>
        <th>Batch Number</th>
        <th>Storage Location</th>
    </tr>
    </thead>

    <tbody id="transactionTableBody">
    </tbody>
</table>

<script>

    function loadMaterials() {

        fetch('/api/materials')
            .then(response => response.json())
            .then(materials => {

                const tableBody =
                    document.getElementById('materialTableBody');

                tableBody.innerHTML = '';

                materials.forEach(material => {

                    checkLowStock(material.materialId);

                    const row = `
    <tr>
        <td>${material.materialId}</td>
        <td>${material.materialName}</td>
        <td>${material.materialType}</td>
        <td>${material.batchNumber}</td>
        <td>${material.storageLocation}</td>
        <td>${material.quantity}</td>
        <td>
            <button onclick="updateMaterial(${material.materialId})">
                Update
            </button>

            <button onclick="deleteMaterial(${material.materialId})">
                Delete
            </button>
        </td>
    </tr>
`;

                    tableBody.innerHTML += row;
                });
            });
    }

    document.getElementById('materialForm')
        .addEventListener('submit', function(event) {

            event.preventDefault();

            const material = {

                materialName:
                document.getElementById('materialName').value,

                materialType:
                document.getElementById('materialType').value,

                batchNumber:
                document.getElementById('batchNumber').value,

                storageLocation:
                document.getElementById('storageLocation').value,

                quantity:
                    parseInt(document.getElementById('quantity').value)
            };

            fetch('/api/materials', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(material)

            })
                .then(response => response.json())
                .then(() => {

                    document.getElementById('materialForm').reset();

                    loadMaterials();
                });
        });

    loadMaterials();
    loadTransactionHistory();
    function updateMaterial(id) {

        const name = prompt("Enter Material Name:");
        const type = prompt("Enter Material Type (Fabric/Accessory):");
        const batch = prompt("Enter Batch Number:");
        const location = prompt("Enter Storage Location:");
        const quantity = prompt("Enter Quantity:");

        if (!name || !type || !batch || !location || !quantity) {
            alert("All fields are required.");
            return;
        }

        const material = {
            materialName: name,
            materialType: type,
            batchNumber: batch,
            storageLocation: location,
            quantity: parseInt(quantity)
        };

        fetch('/api/materials/' + id, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(material)
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Update failed");
                }
                return response.json();
            })
            .then(() => {
                alert("Material updated successfully!");
                loadMaterials();
            })
            .catch(error => {
                alert(error.message);
            });
    }


    function deleteMaterial(id) {

        if (!confirm("Are you sure you want to delete this material?")) {
            return;
        }

        fetch('/api/materials/' + id, {
            method: 'DELETE'
        })
            .then(response => {

                if (!response.ok && response.status !== 204) {
                    throw new Error("Delete failed");
                }

                alert("Material deleted successfully!");
                loadMaterials();
            })
            .catch(error => {
                alert(error.message);
            });
    }

    document.getElementById('stockTransactionForm')
        .addEventListener('submit', function(event) {

            event.preventDefault();

            const materialId =
                document.getElementById('transactionMaterialId').value;

            const transactionType =
                document.getElementById('transactionType').value;

            const quantity =
                document.getElementById('transactionQuantity').value;

            const batchNumber =
                document.getElementById('transactionBatchNumber').value;

            const storageLocation =
                document.getElementById('transactionStorageLocation').value;

            const url =
                `/api/stock-transactions?materialId=${materialId}` +
                `&transactionType=${transactionType}` +
                `&quantity=${quantity}` +
                `&batchNumber=${encodeURIComponent(batchNumber)}` +
                `&storageLocation=${encodeURIComponent(storageLocation)}`;

            fetch(url, {
                method: 'POST'
            })
                .then(response => {

                    if (!response.ok) {
                        return response.text().then(message => {
                            throw new Error(message);
                        });
                    }

                    return response.json();
                })
                .then(() => {

                    alert('Stock transaction recorded successfully!');

                    document.getElementById('stockTransactionForm').reset();

                    loadMaterials();
                })
                .catch(error => {

                    alert(error.message);

                });
        });

    document.getElementById('minimumStockForm')
        .addEventListener('submit', function(event) {

            event.preventDefault();

            const materialId =
                document.getElementById('minimumMaterialId').value;

            const minimumQuantity =
                document.getElementById('minimumQuantity').value;

            const url =
                `/api/minimum-stock?materialId=${materialId}` +
                `&minimumQuantity=${minimumQuantity}`;

            fetch(url, {
                method: 'POST'
            })
                .then(response => {

                    if (!response.ok) {
                        return response.text().then(message => {
                            throw new Error(message);
                        });
                    }

                    return response.json();
                })
                .then(() => {

                    alert('Minimum stock level set successfully!');

                    document.getElementById('minimumStockForm').reset();

                })
                .catch(error => {

                    alert(error.message);

                });
        });

    function checkLowStock(materialId) {

        fetch('/api/minimum-stock/check/' + materialId)
            .then(response => response.json())
            .then(isLowStock => {

                const alertBox =
                    document.getElementById('stockAlert');

                if (isLowStock) {

                    alertBox.innerHTML =
                        '<h3>⚠️ LOW STOCK ALERT!</h3>' +
                        '<p>Material ID ' + materialId +
                        ' is below the minimum stock level.</p>';

                } else {

                    alertBox.innerHTML = '';
                }
            });
    }

    function loadTransactionHistory() {

        fetch('/api/stock-transactions/history')
            .then(response => response.json())
            .then(transactions => {

                const tableBody =
                    document.getElementById('transactionTableBody');

                tableBody.innerHTML = '';

                transactions.forEach(transaction => {

                    const row = `
                    <tr>
                        <td>${transaction.transactionId}</td>
                        <td>${transaction.material.materialId}</td>
                        <td>${transaction.transactionType}</td>
                        <td>${transaction.quantity}</td>
                        <td>${transaction.batchNumber}</td>
                        <td>${transaction.storageLocation}</td>
                    </tr>
                `;

                    tableBody.innerHTML += row;
                });
            });
    }
</script>

</body>
</html>
